{% extends 'users/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<main class="main">
    <div class="container">
        <div class="mt-5">
            <a href="{% url 'mailing:home' %}" class="btn btn-primary main-all-ategories">На главную</a>
        </div>
            <div class="row mt-4 row-gap-4">
                <div class="col-6">
                    <h2>Вход на сайт</h2>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="buttons-forms d-flex">
                            <button type="submit" class="btn btn-primary">
                                Войти
                            </button>
                            <a href="{% url 'users:register' %}" class="btn btn-warning ml-4">Зарегаться</a>
                        </div>

                    </form>
            </div>
        </div>
    </div>

</main>
{% endblock %}
