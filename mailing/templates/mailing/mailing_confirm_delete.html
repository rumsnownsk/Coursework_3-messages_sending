{% extends 'base_dashboard.html' %}
{% block content %}
    <div class="container mt-5">
        <a href="{% url 'mailing:mailings' %}" class="btn btn-primary main-all-ategories">Назад</a>
    </div>
    <div class="container mt-4">
        <div class="row row-gap-4">

            <div class="col-6">
                <h2>Удалить рассылку</h2>
                <p>Вы уверены, что хотите удалить рассылку «{{ object.name }}»?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
