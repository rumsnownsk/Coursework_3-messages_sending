{% if not user.is_email_verified %}
    <div class="alert alert-warning d-flex align-items-center gap-2" role="alert">
        <span class="alert-icon">⚠️</span>
        <span class="alert-text">Ваш email не подтверждён. Функционал ограничен.</span>
    </div>

    <div class="verification-block">
        <p>Чтобы получить полный доступ, подтвердите email:</p>

        <form method="post" action="{% url 'mailing:request_verification' %}">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <input type="email"
                       name="email"
                       value="{{ user.email|default:'' }}"
                       placeholder="Ваш email"
                       required
                       class="form-control"
                       style="flex: 1; min-width: 250px;">
                <button type="submit" class="btn btn-primary">Верифицироваться по почте</button>
            </div>
        </form>
    </div>
{% endif %}
